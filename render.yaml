services:
  - type: web
    name: novocuidabem
    env: python
    plan: starter
    autoDeploy: true
    buildCommand: pip install -r requirements-prod.txt
    startCommand: gunicorn --timeout 120 -w 1 -b 0.0.0.0:$PORT app:app
    disk:
      name: db
      sizeGB: 1
      mountPath: /opt/render/project/src/data
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DB_PATH
        value: /opt/render/project/src/data/cuidabem.db
      - key: AI_ENABLED
        value: "false"